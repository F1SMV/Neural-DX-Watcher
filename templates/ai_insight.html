<style>
    :root {
        --bg-color:#050505; --panel-bg:#0e0e0e; --text-main:#a0a0a0;
        --accent:#00f3ff; --alert:#ff003c; --success:#22c55e; --warn:#ffc800;
        --border:1px solid #333; --dim:#666; --line:#1e1e1e;
    }
    body[data-theme='light']{--bg-color:#fff;--panel-bg:#fff;--text-main:#111;
        --accent:#0066ff;--alert:#d50000;--success:#0a0;--warn:#b58900;
        --border:1px solid #d0d0d0;--dim:#777;--line:#e4e4e4;}
    body[data-theme='dark']{--bg-color:#1a1a1a;--panel-bg:#2a2a2a;--text-main:#f0f0f0;
        --accent:#00ff80;--alert:#ff6347;--success:#3d3;--warn:#ffd700;
        --border:1px solid #555;--dim:#999;--line:#3a3a3a;}
    body[data-theme='matrix']{--bg-color:#000;--panel-bg:#031503;--text-main:#00ff41;
        --accent:#00ff41;--alert:#ff004c;--success:#0f0;--warn:#af0;
        --border:1px solid #050;--dim:#0a5;--line:#052905;}

    body{background:var(--bg-color);color:var(--text-main);
        font-family:var(--font-sans);margin:0;padding:20px;}

    nav.top-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;
        padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.06);}
    nav.top-nav a{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;
        border-radius:6px;border:1px solid rgba(255,255,255,.08);color:#999;
        text-decoration:none;font-size:.78rem;font-weight:600;white-space:nowrap;
        transition:border-color .15s,color .15s,background .15s;}
    nav.top-nav a:hover{border-color:rgba(0,243,255,.35);color:#00f3ff;
        background:rgba(0,243,255,.06);}
    nav.top-nav a.active{border-color:rgba(255,107,94,.5);color:#ff6b5e;
        background:rgba(255,107,94,.08);}

    header{display:flex;justify-content:space-between;align-items:center;
        flex-wrap:wrap;gap:10px;border-bottom:2px solid var(--accent);
        padding-bottom:10px;margin-bottom:16px;}
    h1{font-family:var(--font-display);font-size:1.15rem;color:var(--accent);
        margin:0;text-transform:uppercase;letter-spacing:1px;}
    .head-right{display:flex;align-items:center;gap:10px;font-size:.75rem;
        color:var(--dim);}
    select.band-select{background:var(--panel-bg);color:var(--text-main);
        border:var(--border);border-radius:6px;padding:5px 8px;
        font-size:.75rem;font-family:inherit;}

    /* ── Bouton thème ────────────────────────────────────────── */
    #theme-btn{background:none;border:var(--border);border-radius:6px;
        color:var(--text-main);cursor:pointer;font-size:1rem;
        padding:4px 10px;line-height:1;transition:border-color .15s,background .15s;
        flex-shrink:0;}
    #theme-btn:hover{border-color:var(--accent);background:rgba(255,255,255,.05);}

    /* ── Bandeau de maturité ─────────────────────────────── */
    .maturity{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
        padding:11px 14px;margin-bottom:18px;border:var(--border);
        border-radius:10px;background:var(--panel-bg);font-size:.78rem;}
    .maturity-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .maturity-label{font-weight:600;color:var(--text-main);}
    .maturity-track{flex:1;min-width:120px;height:8px;border-radius:4px;
        background:rgba(255,255,255,.07);overflow:hidden;}
    .maturity-fill{height:100%;border-radius:4px;transition:width .8s ease;}
    .maturity-note{color:var(--dim);font-size:.72rem;}

    .dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(400px,1fr));
        gap:18px;}
    .panel{background:var(--panel-bg);border:var(--border);border-radius:14px;
        padding:15px;box-shadow:0 10px 28px rgba(0,0,0,.45);
        display:flex;flex-direction:column;}
    .panel.grid-full{grid-column:1/-1;}
    .panel.locked{opacity:.55;}
    .panel-header{font-family:var(--font-display);font-size:.8rem;color:var(--accent);
        margin-bottom:6px;padding-bottom:8px;border-bottom:1px solid var(--line);
        display:flex;justify-content:space-between;align-items:center;gap:8px;
        text-transform:uppercase;letter-spacing:.05em;}
    .panel-header .tag{font-size:.62rem;color:var(--dim);text-transform:none;
        letter-spacing:0;font-family:'IBM Plex Mono',monospace;}
    .panel-sub{font-size:.7rem;color:var(--dim);font-style:italic;
        margin-bottom:12px;line-height:1.4;}
    .sub-en{display:block;margin-top:4px;opacity:.7;font-style:italic;}

    .no-data{padding:16px;text-align:center;color:var(--dim);font-size:.78rem;
        line-height:1.5;border:1px dashed var(--line);border-radius:8px;}
    .no-data b{display:block;margin-bottom:4px;color:var(--text-main);}

    /* ── Activité récente ────────────────────────────────── */
    /* Ligne de labels au-dessus des barres */
    .spark-label-row{display:flex;gap:2px;height:18px;align-items:flex-end;
        margin-bottom:2px;}
    .spark-label-row span{flex:1;min-width:3px;text-align:center;
        font-size:.58rem;font-family:'IBM Plex Mono',monospace;
        overflow:hidden;white-space:nowrap;line-height:1;}

    /* Barres */
    .spark{display:flex;align-items:flex-end;gap:2px;height:120px;
        border-bottom:2px solid var(--line);}
    .spark-bar{flex:1;min-width:3px;border-radius:2px 2px 0 0;
        transition:height .3s,opacity .2s;cursor:default;}
    .spark-bar.now{box-shadow:0 0 8px var(--success);}
    .spark-bar:hover{opacity:.85;filter:brightness(1.3);}

    /* Axe X */
    .spark-axis{display:flex;gap:2px;margin-top:4px;}
    .spark-axis span{flex:1;min-width:3px;text-align:center;font-size:.6rem;
        color:var(--dim);font-family:'IBM Plex Mono',monospace;overflow:hidden;
        white-space:nowrap;}
    .spark-axis span.is-now{color:var(--success);font-weight:700;}

    /* Légende sous le graphe */
    .spark-meta{display:flex;align-items:center;gap:8px;margin-top:6px;
        font-size:.68rem;color:var(--dim);flex-wrap:wrap;}
    .spark-meta b{font-family:'IBM Plex Mono',monospace;}

    /* KPI */
    .kpi-row{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 4px;}
    .kpi{flex:1;min-width:90px;}
    .kpi-value{font-size:2.1rem;font-weight:700;color:var(--accent);
        font-family:'IBM Plex Mono',monospace;line-height:1.1;}
    .kpi-label{font-size:.65rem;color:var(--dim);text-transform:uppercase;
        letter-spacing:.04em;margin-top:3px;}

    /* Chips bandes */
    .band-section-title{font-size:.68rem;color:var(--dim);
        text-transform:uppercase;letter-spacing:.05em;
        margin:10px 0 5px;font-family:'IBM Plex Mono',monospace;}
    .band-chips{display:flex;gap:6px;flex-wrap:wrap;}
    .band-chip{font-family:'IBM Plex Mono',monospace;font-size:.7rem;
        padding:4px 9px;border-radius:12px;border:1px solid var(--line);
        background:rgba(255,255,255,.02);display:flex;align-items:center;gap:4px;}
    .band-chip b{font-weight:700;}
    .band-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

    /* ── Heatmap ─────────────────────────────────────────── */
    .heatmap-scroll{overflow-x:auto;padding-bottom:6px;}
    table.heatmap{border-collapse:collapse;font-size:.6rem;min-width:520px;}
    table.heatmap th{font-weight:500;color:var(--dim);padding:2px 3px;
        font-family:'IBM Plex Mono',monospace;}
    table.heatmap td{width:19px;height:17px;padding:0;
        border:1px solid rgba(0,0,0,.35);border-radius:2px;}
    table.heatmap td.void{background:repeating-linear-gradient(45deg,
        transparent,transparent 2px,rgba(255,255,255,.05) 2px,rgba(255,255,255,.05) 4px);}
    .legend{display:flex;align-items:center;gap:8px;margin-top:10px;
        font-size:.65rem;color:var(--dim);flex-wrap:wrap;}
    .legend-scale{display:flex;gap:2px;}
    .legend-scale span{width:15px;height:9px;border-radius:2px;}
    .callout{margin-top:10px;padding:8px 10px;background:rgba(255,200,0,.07);
        border-left:3px solid var(--warn);border-radius:4px;font-size:.79rem;}

    /* ── Patterns ────────────────────────────────────────── */
    .pattern-row{display:flex;align-items:center;gap:8px;padding:6px 4px;
        border-bottom:1px solid var(--line);}
    .pattern-row:last-of-type{border-bottom:none;}
    .pattern-row.insufficient{opacity:.45;}
    .pattern-band{font-family:'IBM Plex Mono',monospace;font-weight:700;
        width:54px;flex-shrink:0;font-size:.82rem;
        display:flex;align-items:center;gap:5px;}
    .pattern-bar-wrap{flex:1;height:14px;background:rgba(255,255,255,.05);
        border-radius:5px;overflow:hidden;position:relative;}
    .pattern-bar{height:100%;border-radius:5px;transition:width .5s ease;
        position:relative;}
    .pattern-bar::after{content:'';position:absolute;inset:0;
        background:linear-gradient(90deg,rgba(255,255,255,.18) 0%,transparent 100%);
        border-radius:5px;}
    .pattern-trend{width:72px;text-align:right;flex-shrink:0;
        font-size:.72rem;font-family:'IBM Plex Mono',monospace;font-weight:700;}
    .pattern-avg{width:56px;text-align:right;flex-shrink:0;
        font-size:.66rem;color:var(--dim);font-family:'IBM Plex Mono',monospace;}
    .trend-up{color:var(--success);} .trend-down{color:var(--alert);}
    .trend-stable{color:var(--dim);} .trend-insufficient{color:#555;font-style:italic;}

    /* ── Forecast ────────────────────────────────────────── */
    .forecast-strip{display:flex;gap:7px;flex-wrap:wrap;}
    .forecast-slot{flex:1;min-width:74px;padding:9px 5px;border:1px solid var(--line);
        border-radius:8px;text-align:center;background:rgba(255,255,255,.02);}
    .forecast-slot.best{border-color:var(--success);background:rgba(34,197,94,.08);}
    .forecast-hour{font-size:.68rem;color:var(--dim);
        font-family:'IBM Plex Mono',monospace;}
    .forecast-prob{font-size:1.3rem;font-weight:700;margin:3px 0;
        font-family:'IBM Plex Mono',monospace;}
    .forecast-prob.unknown{font-size:.9rem;color:#4a4a4a;}
    .forecast-conf{font-size:.57rem;color:var(--dim);}
    .forecast-conf.low-sample{color:var(--warn);font-weight:700;}

    .footnote{font-size:.68rem;color:var(--dim);margin-top:12px;padding-top:8px;
        border-top:1px solid var(--line);line-height:1.45;}
    .btn-hunt{display:block;text-align:center;text-decoration:none;
        background:rgba(255,107,94,.1);border:1px solid #ff6b5e;color:#ff6b5e;
        padding:8px 12px;font-size:.75rem;border-radius:6px;margin-top:12px;
        text-transform:uppercase;letter-spacing:.04em;}
    .btn-hunt:hover{background:rgba(255,107,94,.2);}
</style>

<header>
    <h1>📊 DX Analytics</h1>
    <div class="head-right">
        <label for="band-filter">Bande :</label>
        <select id="band-filter" class="band-select">
            <option value="">Toutes</option>
            <option value="6m">6m</option><option value="10m">10m</option>
            <option value="12m">12m</option><option value="15m">15m</option>

        </select>
        <span>MàJ <span id="last-update">--:--</span></span>
        <button id="theme-btn" onclick="cycleTheme()" title="Changer le thème">🌙</button>

</header>

<div id="maturity-bar"></div>

<div class="dashboard-grid">
    <div class="panel grid-full" data-panel="recent"></div>
    <div class="panel grid-full" data-panel="forecast"></div>

    <div class="panel grid-full" data-panel="patterns"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// Neural DX Watcher — DX Analytics v12.5
// Panneau analytique : activité récente, prévisions, heatmap, tendances.
// ═══════════════════════════════════════════════════════════════════════

// ── Couleurs et ordre des bandes ───────────────────────────────────────
const BAND_COLORS = {
    '160m':'#ef4444','80m':'#f97316','60m':'#f59e0b',
    '40m':'#eab308','30m':'#84cc16','20m':'#22c55e',
    '17m':'#10b981','15m':'#06b6d4','12m':'#3b82f6',
    '10m':'#6366f1','6m':'#a855f7','4m':'#d946ef',
    '2m':'#ec4899','70cm':'#f43f5e','23cm':'#fb923c'
};
// Ordre radio logique OHF → UHF
const BAND_ORDER = ['160m','80m','60m','40m','30m','20m','17m','15m',
                    '12m','10m','6m','4m','2m','70cm','23cm'];
function bandColor(b) { return BAND_COLORS[b] || '#888'; }
function bandSortKey(b) {
    const i = BAND_ORDER.indexOf(b);
    return i === -1 ? 999 : i;
}

// ── Thème jour/nuit ────────────────────────────────────────────────────
const THEMES = ['', 'dark', 'light', 'matrix'];
const THEME_ICONS = { '':'🌙', dark:'☀️', light:'🌙', matrix:'💚' };

function cycleTheme() {
    const cur = document.body.getAttribute('data-theme') || '';
    const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
    if (next) {
        document.body.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
    } else {
        document.body.removeAttribute('data-theme');
        localStorage.removeItem('theme');
    }
    const btn = document.getElementById('theme-btn');
    if (btn) btn.textContent = THEME_ICONS[next] || '🌙';
}

// Applique le thème sauvegardé au chargement
(function () {
    const t = localStorage.getItem('theme');
    if (t) {
        document.body.setAttribute('data-theme', t);
        const btn = document.getElementById('theme-btn');
        if (btn) btn.textContent = THEME_ICONS[t] || '🌙';
    }
})();

// ── Cache ──────────────────────────────────────────────────────────────
class DXCache {
    static TTL_MS = 5 * 60 * 1000; // 5 min — cohérent avec le refresh

    static set(key, data) {
        try {
            localStorage.setItem('dxa_' + key,
                JSON.stringify({ data, exp: Date.now() + this.TTL_MS }));
        } catch (e) {}
    }
    static get(key) {
        try {
            const raw = localStorage.getItem('dxa_' + key);
            if (!raw) return null;
            const { data, exp } = JSON.parse(raw);
            if (Date.now() > exp) { localStorage.removeItem('dxa_' + key); return null; }
            return data;
        } catch (e) { return null; }
    }
}

// ── Panneau ────────────────────────────────────────────────────────────
class DXPanel {
    constructor(key, renderer) { this.key = key; this.renderer = renderer; }
    render(data) {
        const el = document.querySelector(`[data-panel="${this.key}"]`);
        if (!el) return;
        try {
            const out = this.renderer(data) || '';
            el.innerHTML = out.html !== undefined ? out.html : out;
            el.classList.toggle('locked', Boolean(out.locked));
        } catch (err) {
            console.error(`panel ${this.key}:`, err);
            el.innerHTML = `<div class="panel-header">${this.key}</div>
                <div class="no-data"><b>Erreur d'affichage</b>Voir la console.</div>`;
        }
    }
}

// ── Utilitaires ────────────────────────────────────────────────────────
function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g,
        c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtDuration(hours) {
    if (hours == null) return '';
    if (hours < 1) return Math.round(hours * 60) + ' min';
    if (hours < 48) return Math.round(hours) + ' h';
    return Math.round(hours / 24) + ' j';
}

// Échelle continue teal → ambre
function heatColor(ratio) {
    if (ratio <= 0) return 'rgba(255,255,255,.04)';
    const stops = [[0,[0,60,75]],[.35,[0,160,180]],[.65,[255,200,0]],[1,[255,90,40]]];
    let lo = stops[0], hi = stops[stops.length - 1];
    for (let i = 0; i < stops.length - 1; i++) {
        if (ratio >= stops[i][0] && ratio <= stops[i+1][0]) { lo = stops[i]; hi = stops[i+1]; break; }
    }
    const span = hi[0] - lo[0];
    const t = span === 0 ? 0 : (ratio - lo[0]) / span;
    const c = lo[1].map((v,i) => Math.round(v + (hi[1][i] - v) * t));
    return `rgb(${c[0]},${c[1]},${c[2]})`;
}

// Assemble une explication FR + traduction EN discrète, pour tous les panneaux.
function bisub(fr, en) {
    return `${fr}<span class="sub-en">🇬🇧 ${en}</span>`;
}

function lockedPanel(title, sub, maturity, needLabel) {
    // needLabel accepte soit une chaîne (rétro-compat), soit {fr, en}.
    const need = typeof needLabel === 'string' ? { fr: needLabel, en: needLabel } : needLabel;
    const remaining = maturity && maturity.hours_remaining != null
        ? { fr: `Disponible dans environ ${fmtDuration(maturity.hours_remaining)} de collecte.`,
            en: `Available in about ${fmtDuration(maturity.hours_remaining)} of collection.` }
        : { fr: '', en: '' };
    return {
        locked: true,
        html: `<div class="panel-header">${title}
                <span class="tag">en attente</span></div>
            <div class="panel-sub">${sub}</div>
            <div class="no-data"><b>${esc(need.fr)}</b>${esc(remaining.fr)}
                <div class="sub-en">🇬🇧 ${esc(need.en)} ${esc(remaining.en)}</div></div>`,
    };
}

// ── Bandeau de maturité (avec décalage temporel lissé) ─────────────────
// _lastData / _lastFetchMs permettent un tick chaque minute sans appel API.
let _lastData = null, _lastFetchMs = 0;

function renderMaturity(data, extraH = 0) {
    const el = document.getElementById('maturity-bar');
    if (!el || !data) return;
    const m = data.maturity;
    if (!m) { el.innerHTML = ''; return; }

    const colors = { collecting:'var(--warn)', basic:'var(--accent)',
                     daily:'var(--accent)', weekly:'var(--success)' };
    const color = colors[m.level] || 'var(--dim)';

    const spanH   = (m.span_hours || 0) + extraH;
    const hoursLeft = Math.max(0, (m.hours_remaining || 0) - extraH);

    let pct = 100, note = 'Historique complet — toutes les analyses sont actives.';
    if (m.next_at_hours) {
        const levelStarts = { collecting:0, basic:6, daily:48, weekly:336 };
        const from = levelStarts[m.level] || 0;
        const span = m.next_at_hours - from;
        pct = span > 0 ? Math.max(2, Math.min(99, (spanH - from) / span * 100)) : 0;
        note = `${fmtDuration(spanH)} d'historique · `
             + `${esc(m.next_level)} dans ~${fmtDuration(hoursLeft)}`;
    }

    el.innerHTML = `<div class="maturity">
        <span class="maturity-dot" style="background:${color}"></span>
        <span class="maturity-label">${esc(m.label)}</span>
        <span class="maturity-track">
            <span class="maturity-fill" style="width:${pct.toFixed(1)}%;background:${color}"></span>
        </span>
        <span class="maturity-note">${note}</span>
    </div>`;
}

// ── Renderers ──────────────────────────────────────────────────────────

// ── Activité récente ───────────────────────────────────────────────────
const recentRenderer = (data) => {
    const r = data.recent || {};
    const head = `<div class="panel-header">⚡ Activité récente
        <span class="tag">${r.hours || 24} dernières heures</span></div>
        <div class="panel-sub">${bisub(
            "Spots reçus heure par heure — toutes bandes confondues. Barres colorées du froid (peu actif) au chaud (très actif). Le pic est libellé en orange, l'heure courante en vert.",
            "Spots received hour by hour — all bands combined. Bars run from cool (quiet) to hot (very active). The peak is labeled in orange, the current hour in green."
        )}</div>`;

    if (!r.available || !r.series || !r.series.length) {
        return head + `<div class="no-data"><b>Aucun spot reçu</b>
            Vérifie la connexion aux clusters DX.</div>`;
    }

    const peak = Math.max(r.peak || 0, 1);
    const avg  = Math.round(r.total / r.series.length);

    // Ligne de labels au-dessus des barres (pic + heure courante)
    const labelRow = r.series.map((p) => {
        const isNow  = p.hours_ago === 0;
        const isPeak = p.count === r.peak && p.count > 0;
        if (!isNow && !isPeak) return `<span></span>`;
        const color = isNow ? 'var(--success)' : 'var(--warn)';
        return `<span style="color:${color};font-weight:700">${p.count}</span>`;
    }).join('');

    // Barres colorées par intensité
    const bars = r.series.map((p) => {
        const ratio = p.count / peak;
        const h     = Math.max(3, Math.round(ratio * 100));
        const isNow = p.hours_ago === 0;
        const color = isNow ? 'var(--success)' : heatColor(ratio);
        const glow  = isNow ? 'box-shadow:0 0 8px var(--success);' : '';
        const hour  = String(p.hour_utc).padStart(2, '0');
        return `<span class="spark-bar${isNow ? ' now' : ''}"
            style="height:${h}%;background:${color};${glow}"
            title="${hour}z — ${p.count} spots/h"></span>`;
    }).join('');

    // Axe X : heure toutes les 4 tranches + marqueur "maintenant"
    const axis = r.series.map((p, idx) => {
        const isNow    = p.hours_ago === 0;
        const showHour = idx % 4 === 0 && !isNow;
        const label    = isNow ? '▲' : showHour ? String(p.hour_utc).padStart(2,'0') : '';
        return `<span${isNow ? ' class="is-now"' : ''}>${label}</span>`;
    }).join('');

    // Chips de bandes avec couleur
    const chips = (r.bands || []).slice(0, 8).map(b => {
        const c = bandColor(b.band);
        return `<span class="band-chip" style="border-color:${c}55;background:${c}18">
            <span class="band-dot" style="background:${c}"></span>
            ${esc(b.band)} <b style="color:${c}">${b.count}</b></span>`;
    }).join('');

    // Section modes (si l'API renvoie r.modes)
    const modeChips = (r.modes || []).slice(0, 5).map(m =>
        `<span class="band-chip"><b>${esc(m.mode)}</b> ${m.count}</span>`).join('');
    const modeSection = modeChips
        ? `<div class="band-section-title">Mode</div>
           <div class="band-chips">${modeChips}</div>` : '';

    return head
        + `<div class="spark-label-row">${labelRow}</div>`
        + `<div class="spark">${bars}</div>`
        + `<div class="spark-axis">${axis}</div>`
        + `<div class="spark-meta">
            <span>UTC →</span>
            <span style="margin-left:auto">
                Pic : <b style="color:var(--warn)">${r.peak} spots/h</b>
                &nbsp;·&nbsp; Moyenne : <b>${avg}/h</b>
            </span>
           </div>`
        + `<div class="kpi-row">
            <div class="kpi">
                <div class="kpi-value">${r.total.toLocaleString('fr-FR')}</div>
                <div class="kpi-label">spots ${r.hours}h</div>
            </div>
            <div class="kpi">
                <div class="kpi-value">${avg}</div>
                <div class="kpi-label">moy. / heure</div>
            </div>
            <div class="kpi">
                <div class="kpi-value">${r.peak}</div>
                <div class="kpi-label">pic horaire</div>
            </div>
            <div class="kpi">
                <div class="kpi-value">${(r.bands||[]).length}</div>
                <div class="kpi-label">bandes actives</div>
            </div>
           </div>`
        + `<div class="band-section-title">Répartition par bande</div>`
        + `<div class="band-chips">${chips}</div>`
        + modeSection;
};

// ── Prochaines heures ──────────────────────────────────────────────────
const forecastRenderer = (data) => {
    const f = data.forecast || {};
    const basisLabel = f.basis === 'weekday'
        ? 'même jour de semaine et même heure / same weekday & hour'
        : 'même heure, tous jours confondus / same hour, any day';
    const head = `<div class="panel-header">🔮 Prochaines heures
        <span class="tag">${f.available ? esc(basisLabel) : ''}</span></div>
        <div class="panel-sub">${bisub(
            "Le % indique la fréquence à laquelle <b>au moins un spot</b> a été reçu sur ce créneau dans le passé — ce n'est pas la force d'une ouverture ni une prévision de propagation. Avec peu de jours d'historique (regarde le nombre d'« obs »), les spots arrivant presque en continu, il est normal que la plupart des créneaux affichent 100 %.",
            "The % shows how often <b>at least one spot</b> was received in this slot in the past — not opening strength, and not a propagation forecast. With only a few days of history (check the \u201cobs\u201d count), spots arrive almost continuously, so most slots naturally read 100%."
        )}</div>`;

    if (!f.available || !f.slots.length) {
        return lockedPanel('🔮 Prochaines heures',
            bisub("Fréquence d'activité observée sur les créneaux à venir.",
                  "How often activity has been observed on upcoming slots."),
            data.maturity,
            { fr: "Pas encore assez de créneaux observés",
              en: "Not enough time slots observed yet" });
    }

    const bestOffset = f.best_slot ? f.best_slot.offset_h : -1;
    const slots = f.slots.map(s => {
        const isBest = s.offset_h === bestOffset && s.probability !== null;
        const label = s.offset_h === 0 ? 'maintenant / now' : `+${s.offset_h}h`;
        const prob = s.probability === null
            ? `<div class="forecast-prob unknown">—</div>`
            : `<div class="forecast-prob" style="color:${heatColor(s.probability/100)}">${s.probability}%</div>`;
        // Échantillon faible (< 5 observations) : peu fiable, on le signale en orange
        // plutôt que de laisser un 100 % nu et non qualifié.
        const lowSample = s.probability !== null && s.observations < 5;
        const conf = s.probability === null
            ? `${s.observations} obs.`
            : `${s.observations} obs · ${s.avg_spots}/h`;
        return `<div class="forecast-slot ${isBest ? 'best' : ''}">
            <div class="forecast-hour">${esc(label)}</div>
            <div class="forecast-hour">${String(s.hour_utc).padStart(2,'0')}z</div>
            ${prob}<div class="forecast-conf${lowSample ? ' low-sample' : ''}"
                title="${lowSample ? 'Échantillon faible — estimation à prendre avec prudence / Small sample — take this estimate with caution' : ''}">${esc(conf)}</div></div>`;
    }).join('');

    let verdict = '';
    if (f.best_slot && f.best_slot.probability !== null) {
        const b = f.best_slot;
        const when = b.offset_h === 0 ? 'maintenant' : `dans ${b.offset_h}h`;
        const whenEn = b.offset_h === 0 ? 'now' : `in ${b.offset_h}h`;
        verdict = `<div class="callout">
            <div>Meilleur créneau : <b>${when}</b>
            (${String(b.hour_utc).padStart(2,'0')}z) — activité observée
            ${b.probability}% du temps${f.band ? ' sur ' + esc(f.band) : ''}
            (n=${b.observations} obs.).</div>
            <div class="sub-en">🇬🇧 Best slot: <b>${whenEn}</b>
            (${String(b.hour_utc).padStart(2,'0')}z) — activity observed
            ${b.probability}% of the time${f.band ? ' on ' + esc(f.band) : ''}
            (n=${b.observations} obs.).</div></div>`;
    }

    return head + `<div class="forecast-strip">${slots}</div>` + verdict +
        `<a href="/hunt" class="btn-hunt">🎯 Ouvrir le mode chasse / Open hunt mode</a>`;
};

// ── Heatmap ────────────────────────────────────────────────────────────
const heatmapRenderer = (data) => {
    const h = data.heatmap || {};
    if (!h.available || !h.grid || !(h.peak_value > 0)) {
        return lockedPanel('🗓 Quand ça ouvre',
            bisub("Activité moyenne par jour de semaine et heure UTC.",
                  "Average activity by weekday and UTC hour."),
            data.maturity,
            { fr: "Il faut au moins 2 jours d'historique",
              en: "At least 2 days of history needed" });
    }

    const head = `<div class="panel-header">🗓 Quand ça ouvre
        <span class="tag">${h.total_spots.toLocaleString('fr-FR')} spots · ${h.days} j</span></div>
        <div class="panel-sub">${bisub(
            "Moyenne par occurrence du créneau, et non cumul : sinon les jours les mieux représentés dans la fenêtre ressortiraient artificiellement.",
            "Average per occurrence of the slot, not a running total — otherwise days better represented in the window would stand out artificially."
        )}</div>`;

    const peak = h.peak_value;
    const hours = Array.from({length:24}, (_,i) => i);
    const headerRow = `<tr><th></th>${hours.map(i =>
        `<th>${i % 3 === 0 ? String(i).padStart(2,'0') : ''}</th>`).join('')}</tr>`;

    const rows = h.grid.map((row, wd) => {
        const cells = row.map((v, hr) => {
            const when = `${h.weekday_labels[wd]} ${String(hr).padStart(2,'0')}z`;
            if (v === null) return `<td class="void" title="${when} — pas d'observation"></td>`;
            return `<td style="background:${heatColor(v/peak)}" title="${when} — ${v} spots/h"></td>`;
        }).join('');
        return `<tr><th>${esc(h.weekday_labels[wd])}</th>${cells}</tr>`;
    }).join('');

    const legend = `<div class="legend"><span>calme</span>
        <span class="legend-scale">${[0,.2,.4,.6,.8,1].map(r =>
            `<span style="background:${heatColor(r)}"></span>`).join('')}</span>
        <span>actif</span><span style="margin-left:12px;">hachuré = aucune observation</span></div>`;

    let best = '';
    if (h.best_slot) {
        const b = h.best_slot;
        best = `<div class="callout">
            <div>Créneau le plus actif :
            <b>${esc(b.weekday_label)} ${String(b.hour).padStart(2,'0')}z</b>
            — ${b.value} spots/h en moyenne${h.band ? ' sur ' + esc(h.band) : ''}.</div>
            <div class="sub-en">🇬🇧 Busiest slot:
            <b>${esc(b.weekday_label)} ${String(b.hour).padStart(2,'0')}z</b>
            — ${b.value} spots/h on average${h.band ? ' on ' + esc(h.band) : ''}.</div></div>`;
    }

    return head + `<div class="heatmap-scroll"><table class="heatmap">${headerRow}${rows}</table></div>`
        + legend + best;
};

// ── Tendances par bande ────────────────────────────────────────────────
const patternsRenderer = (data) => {
    const p = data.patterns || {};
    if (!p.available || !p.bands.length) {
        return lockedPanel('📈 Tendances par bande',
            bisub("Comparaison d'une période récente avec la précédente.",
                  "Comparison of a recent period with the previous one."),
            data.maturity,
            { fr: "Il faut deux périodes comparables (~12 h)",
              en: "Two comparable periods needed (~12 h)" });
    }

    const win = p.window_days >= 1
        ? `${p.window_days} j` : `${p.window_hours} h`;
    const head = `<div class="panel-header">📈 Tendances par bande
        <span class="tag">${win} vs ${win} précédents</span></div>
        <div class="panel-sub">${bisub(
            "Barres en couleur par bande, ordre 160 m → 23 cm. Une bande sous 10 spots n'est pas qualifiée (grisée).",
            "Color bars by band, ordered 160 m → 23 cm. A band under 10 spots is not qualified (greyed out)."
        )}</div>`;

    // Tri : ordre radio logique, Unknown à la fin
    const sorted = [...p.bands].sort((a, b) => {
        if (a.band === 'Unknown') return 1;
        if (b.band === 'Unknown') return -1;
        return bandSortKey(a.band) - bandSortKey(b.band);
    });

    const maxCount = Math.max(...sorted.map(b => b.recent_count), 1);

    const rows = sorted.map(b => {
        const bc    = bandColor(b.band);
        const width = Math.round(b.recent_count / maxCount * 100);
        const insufficient = b.trend === 'insufficient' || b.trend == null;

        let trendCls, trendLabel;
        switch (b.trend) {
            case 'up':
                trendCls = 'trend-up';
                trendLabel = b.change_pct === null ? '▲ nouveau' : `▲ +${b.change_pct}%`;
                break;
            case 'down':
                trendCls = 'trend-down';
                trendLabel = `▼ ${b.change_pct}%`;
                break;
            case 'stable':
                trendCls = 'trend-stable';
                trendLabel = '● stable';
                break;
            default:
                trendCls = 'trend-insufficient';
                trendLabel = 'trop peu';
        }

        // La barre utilise la couleur de bande ; le fond montre la capacité max
        return `<div class="pattern-row${insufficient ? ' insufficient' : ''}">
            <span class="pattern-band" style="color:${bc}">
                <span class="band-dot" style="background:${bc}"></span>${esc(b.band)}
            </span>
            <span class="pattern-bar-wrap" title="${b.recent_count} spots">
                <span class="pattern-bar"
                    style="width:${width}%;background:${bc}"></span>
            </span>
            <span class="pattern-trend ${trendCls}">${trendLabel}</span>
            <span class="pattern-avg">${b.daily_avg}/j</span>
        </div>`;
    }).join('');

    const delta = p.total_previous > 0
        ? Math.round((p.total_recent - p.total_previous) / p.total_previous * 100) : null;
    const summary = delta === null ? '' :
        `<div class="footnote">Activité globale :
        ${p.total_recent.toLocaleString('fr-FR')} spots sur la période récente contre
        ${p.total_previous.toLocaleString('fr-FR')} sur la précédente
        (${delta >= 0 ? '+' : ''}${delta}%).</div>`;

    return head + rows + summary;
};

// ── Boucle principale ──────────────────────────────────────────────────
const panels = [
    new DXPanel('recent',   recentRenderer),
    new DXPanel('forecast', forecastRenderer),
    new DXPanel('heatmap',  heatmapRenderer),
    new DXPanel('patterns', patternsRenderer),
];

let currentBand = '';

async function updateDashboard({ useCache = true } = {}) {
    const cacheKey = 'analytics_' + (currentBand || 'all');
    let data = useCache ? DXCache.get(cacheKey) : null;
    let fromCache = Boolean(data);

    if (!data) {
        try {
            const url = '/api/analytics' + (currentBand ? '?band=' + encodeURIComponent(currentBand) : '');
            const res = await fetch(url);
            if (!res.ok) throw new Error('HTTP ' + res.status);
            data = await res.json();
            DXCache.set(cacheKey, data);
        } catch (err) {
            console.error('analytics:', err);
            data = DXCache.get(cacheKey);
            if (!data) {
                for (const p of panels) p.render({});
                document.getElementById('last-update').textContent = 'hors ligne';
                return;
            }
            fromCache = true;
        }
    }

    // Mémoriser pour le tick de maturité
    _lastData = data;
    _lastFetchMs = Date.now();

    renderMaturity(data);
    for (const p of panels) p.render(data);

    document.getElementById('last-update').textContent =
        new Date().toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'})
        + (fromCache ? ' (cache)' : '');
}

document.getElementById('band-filter').addEventListener('change', (e) => {
    currentBand = e.target.value;
    updateDashboard({ useCache: false });
});

// Tick chaque minute pour faire avancer la barre de maturité sans appel API
setInterval(() => {
    if (_lastData && _lastFetchMs) {
        renderMaturity(_lastData, (Date.now() - _lastFetchMs) / 3600000);
    }
}, 60000);

// Refresh des données toutes les 5 minutes
updateDashboard();
setInterval(() => updateDashboard({ useCache: false }), 300000);
</script>

</body>
</html>
